name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: .NET 8 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 빌드와 테스트
        run: dotnet test PharmacyWorkflow.sln --configuration Release --verbosity normal
